# Runs the whole test suite on every push and pull request, on the three
# systems Diffusor is started on and on the oldest and newest Python it
# supports. The window is built off screen (QT_QPA_PLATFORM=offscreen), so the
# interface tests run without a display. The suite never goes online.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # Qt's offscreen platform still loads the GL, font and keyboard libraries
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install
        run: python -m pip install -e ".[dev,images]"

      - name: Test
        run: python -m pytest -q
