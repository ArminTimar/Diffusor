[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diffusor"
dynamic = ["version"]
description = "Unified diffusion chronometry: analytical and numerical 1-D diffusion modelling with literature diffusion coefficients and Monte Carlo error propagation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Armin Timar", email = "timar.armin@gmail.com" }]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "Pillow>=9.0",
    "openpyxl>=3.1",
    "PySide6>=6.5",
]

[project.optional-dependencies]
dev = ["pytest>=7", "pypdf>=3"]
images = ["tifffile>=2023.1"]
validation = ["xlrd>=2.0"]

# a GUI script: the launcher opens the window without a console
[project.gui-scripts]
diffusor = "diffusor.gui.app:main"

# the version lives in diffusor/__init__.py only
[tool.setuptools.dynamic]
version = { attr = "diffusor.__version__" }

[tool.setuptools.packages.find]
include = ["diffusor*"]

[tool.setuptools.package-data]
"diffusor.gui" = ["icons/*.svg", "icons/*.png", "icons/*.ico"]

# Example profiles are data files shared by the desktop app and validation
# tools. Keep them under the installation data directory so wheels stay small
# and the files remain outside the Python import packages.
[tool.setuptools.data-files]
"share/diffusor/examples" = ["examples/*.csv"]
"share/diffusor/examples/images" = ["examples/images/*"]
"share/diffusor/examples/validation" = [
    "examples/validation/*.json",
    "examples/validation/*.md",
    "examples/validation/*.png",
    "examples/validation/*.py",
    "examples/validation/*.svg",
]
"share/diffusor/examples/validation/fits" = ["examples/validation/fits/*"]
"share/diffusor/examples/validation/profiles" = ["examples/validation/profiles/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
